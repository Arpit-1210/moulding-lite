<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Moulding Production — Factory OS</title>
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/src/styles/base.css" />
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <h1>Moulding Production</h1>
      <p class="sub">Peak Season Production Control</p>
      <span class="tag"><span class="dot"></span>Factory OS — Moulding Module v0.1</span>
    </header>

    <main id="app">
      <!-- Screen 1: select supervisor -->
      <section id="view-supervisor-select" class="app-view">
        <div class="field">
          <label for="supervisor-select">Select supervisor</label>
          <select id="supervisor-select">
            <option value="">Loading supervisors…</option>
          </select>
          <span class="hint error-text" id="supervisor-error" hidden></span>
        </div>
        <div class="footer-actions">
          <button id="btn-continue-to-teams" class="btn btn-primary" disabled>Continue</button>
        </div>
      </section>

      <!-- Screen 2: team setup -->
      <section id="view-team-setup" class="app-view">
        <p class="sub" style="margin-bottom: var(--space-4)">
          Supervisor: <strong id="team-setup-supervisor-name"></strong>
        </p>
        <h2 style="font-size: var(--text-lg); margin-bottom: var(--space-4)">Your Teams</h2>
        <div id="teams-list"></div>
        <button id="btn-add-team" class="btn btn-ghost">+ Add team</button>
        <div class="footer-actions">
          <button id="btn-continue-to-production" class="btn btn-primary">
            Continue to production
          </button>
          <div class="skip-link-row">
            <button id="btn-switch-supervisor-1" class="link-button">Not you? Switch supervisor</button>
          </div>
        </div>
      </section>

      <!-- Screen 3: production entry -->
      <section id="view-production-entry" class="app-view">
        <p class="sub" style="margin-bottom: var(--space-4)">
          Supervisor: <strong id="prod-supervisor-name"></strong>
        </p>

        <div class="field">
          <label for="team-select">Team</label>
          <select id="team-select"></select>
        </div>

        <div class="field">
          <label>Product</label>
          <div id="product-combobox"></div>
        </div>

        <div class="field">
          <label for="quantity-input">Quantity</label>
          <input type="number" id="quantity-input" inputmode="numeric" placeholder="0" min="0" step="1" />
          <span class="hint error-text" id="quantity-error" hidden></span>
        </div>

        <div class="field">
          <label for="weight-input">Weight (kg)</label>
          <input type="number" id="weight-input" inputmode="decimal" placeholder="0" min="0" step="0.1" />
          <span class="hint error-text" id="weight-error" hidden></span>
        </div>

        <div class="footer-actions">
          <button id="btn-save-production" class="btn btn-primary">Save production</button>
          <div class="skip-link-row">
            <button id="btn-manage-teams" class="link-button">Manage teams</button>
            <button id="btn-switch-supervisor-2" class="link-button">Switch supervisor</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main-supervisor.js"></script>
</body>
</html>
