<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Factory OS — Owner</title>
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f6f9;
      --surface: #fff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --sidebar-w: 220px;
      --topbar-h: 56px;
    }
    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

    /* ── layout ── */
    .app-shell { display: flex; height: 100%; }

    /* ── sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 200;
      transition: transform 0.25s ease;
    }
    .sidebar-brand {
      display: flex; align-items: center; gap: 10px;
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--border);
    }
    .brand-mark { font-size: 1.5rem; }
    .brand-name { font-size: 1rem; font-weight: 700; letter-spacing: -.5px; }
    .brand-accent { color: var(--accent); }
    .brand-sub { font-size: 0.68rem; color: var(--muted); margin-top: 1px; }
    .owner-badge {
      font-size: 0.6rem; font-weight: 600; letter-spacing: .5px;
      background: #fef3c7; color: #92400e;
      border-radius: 4px; padding: 2px 6px;
      margin-top: 3px; display: inline-block;
    }

    .sidebar-nav { flex: 1; overflow-y: auto; padding: 10px 0; }
    .nav-link {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 16px;
      text-decoration: none; color: var(--muted);
      font-size: 0.88rem; font-weight: 500;
      border-radius: 0;
      transition: background .15s, color .15s;
    }
    .nav-link:hover { background: var(--accent-light); color: var(--accent); }
    .nav-link.is-active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
    .nav-link .emoji { font-size: 1.1rem; width: 22px; text-align: center; }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 0.75rem; color: var(--muted);
      display: flex; align-items: center; gap: 6px;
    }
    .sync-pill { display: flex; align-items: center; gap: 5px; }
    .sync-pill .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #22c55e; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── sidebar overlay (mobile) ── */
    .sidebar-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 199;
    }
    .sidebar-overlay.open { display: block; }

    /* ── main ── */
    .app-main {
      margin-left: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }

    /* ── topbar ── */
    .app-topbar {
      height: var(--topbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 20px;
      position: sticky; top: 0; z-index: 100;
      gap: 12px;
    }
    .hamburger {
      display: none;
      background: none; border: none; cursor: pointer;
      padding: 4px; color: var(--text);
    }
    .hamburger svg { display: block; }
    #page-title { font-size: 1.05rem; font-weight: 700; flex: 1; }
    .topbar-right { display: flex; align-items: center; gap: 8px; }
    .pill {
      font-size: 0.72rem; font-weight: 600;
      background: var(--accent-light); color: var(--accent);
      border-radius: 20px; padding: 3px 10px;
    }
    .mobile-topbar { display: none; }

    /* ── content ── */
    .app-content { padding: 20px; flex: 1; overflow-y: auto; }

    /* ── live pill ── */
    .live-pill {
      position: fixed; bottom: 18px; right: 18px;
      background: #166534; color: #fff;
      border-radius: 20px; padding: 6px 14px;
      font-size: 0.8rem; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
      opacity: 0; pointer-events: none;
      transition: opacity .3s;
      z-index: 999;
    }
    .live-pill.show { opacity: 1; }

    /* ── shared component styles ── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 4px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .kpi-card .label { font-size: .72rem; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
    .kpi-card .value { font-size: 1.3rem; font-weight: 700; }
    .kpi-blue   { border-top: 3px solid #3b82f6; } .kpi-blue   .value { color: #1d4ed8; }
    .kpi-green  { border-top: 3px solid #22c55e; } .kpi-green  .value { color: #15803d; }
    .kpi-orange { border-top: 3px solid #f97316; } .kpi-orange .value { color: #c2410c; }
    .kpi-purple { border-top: 3px solid #a855f7; } .kpi-purple .value { color: #7e22ce; }
    .kpi-slate  { border-top: 3px solid #94a3b8; } .kpi-slate  .value { color: #475569; }
    .kpi-red    { border-top: 3px solid #ef4444; } .kpi-red    .value { color: #b91c1c; }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .panel-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-head h2 { font-size: .9rem; font-weight: 600; }

    .data-table { width: 100%; border-collapse: collapse; font-size: .83rem; }
    .data-table th {
      text-align: left; padding: 10px 12px;
      background: #f8fafc; color: var(--muted);
      font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
      border-bottom: 1px solid var(--border);
    }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table .num { text-align: right; font-variant-numeric: tabular-nums; }

    .state-msg { text-align: center; color: var(--muted); padding: 28px; font-size: .88rem; }
    .error-text { color: #b91c1c; text-align: center; padding: 28px; }

    /* range filter */
    .range-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .range-btn {
      padding: 5px 13px; border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface); cursor: pointer;
      font-size: .8rem; font-weight: 500; color: var(--muted);
      transition: all .15s;
    }
    .range-btn:hover { border-color: var(--accent); color: var(--accent); }
    .range-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* day-wise */
    .daywise-table { padding: 4px 0; }
    .day-row { padding: 10px 16px; border-bottom: 1px solid var(--border); }
    .day-row:last-child { border-bottom: none; }
    .day-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .day-label { font-size: .82rem; font-weight: 600; color: var(--text); min-width: 90px; }
    .day-stats { font-size: .8rem; color: var(--muted); }
    .day-value { color: #15803d; }
    .day-bar-wrap { background: #f1f5f9; border-radius: 4px; height: 6px; overflow: hidden; }
    .day-bar { height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s ease; min-width: 2px; }

    /* ── mobile ── */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .hamburger { display: block; }
      .app-main { margin-left: 0; }
      .app-topbar { padding: 0 14px; }
      .app-content { padding: 14px; }
      .kpi-row { grid-template-columns: 1fr 1fr; }
      .data-table { font-size: .78rem; }
      .data-table th, .data-table td { padding: 8px 10px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">⬡</span>
        <div>
          <div class="brand-name">Factory<span class="brand-accent">OS</span></div>
          <div class="brand-sub">Moulding Department</div>
          <div class="owner-badge">OWNER VIEW</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-link" data-route="dashboard" href="#/dashboard">
          <span class="emoji">🏠</span><span>Dashboard</span>
        </a>
        <a class="nav-link" data-route="production-log" href="#/production/history">
          <span class="emoji">📋</span><span>Production Log</span>
        </a>
        <a class="nav-link" data-route="teams" href="#/teams">
          <span class="emoji">👷</span><span>Teams</span>
        </a>
        <a class="nav-link" data-route="products" href="#/products">
          <span class="emoji">📦</span><span>Products</span>
        </a>
        <a class="nav-link" data-route="settings" href="#/settings">
          <span class="emoji">⚙️</span><span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <span class="sync-pill"><span class="dot"></span>Live</span>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="app-main">
      <header class="app-topbar">
        <button class="hamburger" id="hamburger" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <h1 id="page-title">Dashboard</h1>
        <div class="topbar-right">
          <span class="pill" id="today-pill"></span>
        </div>
      </header>
      <main class="app-content" id="page-root"></main>
    </div>
  </div>

  <div class="live-pill" id="live-pill"><span>✓</span><span>Updated just now</span></div>

  <script type="module" src="/src/main-owner.js"></script>
  <script>
    // Hamburger toggle
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const ham     = document.getElementById('hamburger');
    function openSidebar()  { sidebar.classList.add('open');  overlay.classList.add('open'); }
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
    ham.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
    overlay.addEventListener('click', closeSidebar);
    // Close sidebar on nav click (mobile)
    document.querySelectorAll('.nav-link').forEach(a => a.addEventListener('click', () => {
      if (window.innerWidth <= 768) closeSidebar();
    }));
  </script>
</body>
</html>
