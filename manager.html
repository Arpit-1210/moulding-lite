<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1967D2" />
  <title>Manager — Factory OS Moulding</title>
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/owner.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script>if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})});</script>
  <style>
    body{margin:0;background:var(--bg,#f4f6f9);font-family:Inter,system-ui,sans-serif;color:var(--ink,#101828)}
    .mgr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid #e4e7ec;position:sticky;top:0;z-index:5}
    .mgr-brand{font-weight:700;font-size:17px}.mgr-brand b{color:#1967D2}.mgr-brand span{font-weight:500;font-size:12px;color:#667085;margin-left:6px}
    .mgr-actions{display:flex;gap:8px}
    .refresh-btn{border:1px solid #d0d5dd;background:#fff;color:#1967D2;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
    .mgr-main{max-width:1100px;margin:0 auto;padding:16px}
    .mgr-filters{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:16px;padding:14px 16px;background:#fff;border:1px solid #e4e7ec;border-radius:12px}
    .mgr-filters label{display:block;font-size:12px;font-weight:600;color:#667085;margin-bottom:5px}
    .mgr-filters input{padding:9px 10px;border:1px solid #d0d5dd;border-radius:8px;font-size:15px;background:#fff;min-width:160px}
  </style>
</head>
<body>
  <header class="mgr-top">
    <div class="mgr-brand">Factory<b>OS</b> <span>Moulding · Manager</span></div>
    <div class="mgr-actions"><button type="button" class="refresh-btn" onclick="location.reload()">&#8635; Refresh</button><button type="button" class="refresh-btn" id="mgr-logout">Logout</button></div>
  </header>
  <main class="mgr-main">
    <div class="mgr-filters">
      <div><label for="m-date">📅 Date</label><input type="date" id="m-date" /></div>
      <button type="button" class="refresh-btn" id="m-today">Today</button>
    </div>
    <div id="m-body"><div class="state-msg">Loading…</div></div>
  </main>
  <script type="module" src="/src/main-manager.js"></script>
</body>
</html>
